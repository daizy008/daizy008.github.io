<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Cards - 文化大使方案</title><style>body{margin:0;overflow:hidden;background:#061a32;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif}.ui{position:fixed;left:40px;top:34px;z-index:5}.ui h1{font-size:46px;line-height:1.08;margin:0 0 10px}.ui p{color:#b8c3d6;font-size:18px}.hint{position:fixed;left:40px;bottom:30px;color:#b8c3d6;font-size:14px}.card{position:absolute;width:300px;height:190px;padding:26px;border-radius:22px;background:rgba(255,255,255,.94);color:#071b33;box-shadow:0 30px 80px rgba(0,0,0,.28);transform-style:preserve-3d;transition:transform .3s}.card h2{margin:0 0 12px;font-size:28px}.card p{font-size:17px;line-height:1.45;color:#64748b}.stage{position:fixed;inset:0;perspective:1100px}.ring{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d;animation:spin 30s linear infinite}.card:nth-child(1){transform:rotateY(0deg) translateZ(520px) translate(-150px,-95px)}.card:nth-child(2){transform:rotateY(60deg) translateZ(520px) translate(-150px,-95px)}.card:nth-child(3){transform:rotateY(120deg) translateZ(520px) translate(-150px,-95px)}.card:nth-child(4){transform:rotateY(180deg) translateZ(520px) translate(-150px,-95px)}.card:nth-child(5){transform:rotateY(240deg) translateZ(520px) translate(-150px,-95px)}.card:nth-child(6){transform:rotateY(300deg) translateZ(520px) translate(-150px,-95px)}@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(-360deg)}}.bar{position:fixed;right:32px;top:32px;z-index:5}.bar a{color:#dbeafe;text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:9px 14px;border-radius:999px}</style></head><body><div class="bar"><a href="./index.html">返回首页</a></div><div class="ui"><h1>文化大使方案<br>3D 结构展示</h1><p>适合做开场页、结构页，不适合承载大量正文。</p></div><div class="stage"><div class="ring"><div class="card"><h2>
