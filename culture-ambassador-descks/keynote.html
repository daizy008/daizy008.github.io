<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keynote Style</title><style>body{margin:0;background:#050b14;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;overflow:hidden}.deck{width:100vw;height:100vh;position:relative}.s{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:8vw}.s.on{display:flex;animation:fade .5s ease}.box{max-width:980px}.k{color:#7aa2ff;letter-spacing:.18em;text-transform:uppercase;font-weight:900;font-size:14px}.big{font-size:86px;line-height:1.02;margin:20px 0;font-weight:950;letter-spacing:-.06em}.lead{font-size:30px;line-height:1.42;color:#cbd5e1}.words{display:flex;flex-wrap:wrap;gap:16px;margin-top:36px}.words span{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:13px 20px;font-size:22px;background:rgba(255,255,255,.06)}.ctrl{position:fixed;right:26px;bottom:22px;display:flex;gap:10px}.ctrl button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:11px 16px;cursor:pointer}.back{position:fixed;left:26px;top:20px}.back a{color:#cbd5e1;text-decoration:none}@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}</style></head><body><div class="back"><a href="./index.html">← 返回入口</a></div><main class="deck"><section class="s on"><div class="box"><div class="k">Apple Keynote Style</div><h1 class="big">文化不是活动。</h1><p class="lead">文化是组织中正在发生的行为、故事和连接。</p></div></section><section class="s"><div class="box"><div class="k">Core</div><h1 class="big">重新定义文化大使。</h1><p class="lead">不是额外分配任务，而是识别本来就在影响组织的人。</p></div></section><section class="s"><div class="box"><div class="k">Role</div><h1 class="big">两个层次。</h1><div class="words"><span>文化引领者</span><span>文化推动者</span></div></div></section><section class="s"><div class="box"><div class="k">System</div><h1 class="big">六类角色。</h1><div class="words"><span>职能嵌入</span><span>组织触角</span><span>兴趣社团</span><span>品牌连接</span><span>项目志愿</span><span>文化形象</span></div></div></section><section class="s"><div class="box"><div class="k">Infrastructure</div><h1 class="big">四个机制。</h1><div class="words"><span>积分</span><span>讲堂</span><span>传播</span><span>大会</span></div></div></section><section class="s"><div class="box"><div class="k">Result</div><h1 class="big">文化 → 组织 → 业务</h1><p class="lead">形成持续正循环。</p></div></section></main><div class="ctrl"><button onclick="go(-1)">←</button><button onclick="go(1)">→</button></div><script>let i=0;const s=[...document.querySelectorAll('.s')];function go(d){i=Math.max(0,Math.min(s.length-1,i+d));s.forEach(x=>x.classList.remove('on'));s[i].classList.add('on')}addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)})</script></body></html>
