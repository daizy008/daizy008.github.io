<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Programmable Magazine · 6P Demo</title>
<style>
:root{--bg:#f1efe8;--ink:#111;--muted:#706d66;--line:#c8c4ba;--accent:#f26a21;--page:min(1180px,calc(100vw - 42px))}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#111;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}.page{min-height:100svh;background:var(--bg);scroll-snap-align:start;position:relative;overflow:hidden;border-bottom:1px solid #222}.mag{scroll-snap-type:y mandatory}.inner{width:var(--page);min-height:100svh;margin:auto;padding:42px 0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:20px;border-top:2px solid currentColor;padding-top:9px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.num{white-space:nowrap}.section{font-size:clamp(50px,8vw,108px);line-height:.9;letter-spacing:-.055em;margin:7vh 0 28px;white-space:pre-line}.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}.muted{color:var(--muted)}
.cover{background:#0f0f0f;color:#f4f1e9}.cover:before{content:"";position:absolute;width:56vw;height:56vw;border:1px solid #3c3c3c;border-radius:50%;right:-19vw;top:-22vw}.cover:after{content:"";position:absolute;width:31vw;height:31vw;border:1px solid #2b2b2b;border-radius:50%;right:-6vw;top:-7vw}.coverGrid{flex:1;display:grid;grid-template-columns:1.4fr .6fr;gap:56px;align-items:end;padding-bottom:6vh;position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}.cover h1{font-size:clamp(68px,11vw,154px);line-height:.82;letter-spacing:-.07em;margin:18px 0 0;white-space:pre-line}.coverSide{align-self:center}.coverSide p{font:28px/1.25 Georgia,serif;margin:0 0 28px;max-width:420px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #626262;border-radius:999px;padding:7px 11px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.leadBody{margin-top:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:72px;padding-bottom:5vh}.leadBody>p{font-size:24px;line-height:1.45;margin:0}.note{font-size:12px;line-height:1.45;border-left:3px solid var(--accent);padding-left:12px;color:var(--muted);margin-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}.stat{padding-top:16px}.value{font-size:52px;font-weight:700;letter-spacing:-.06em}.label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.timelineLayout{display:grid;grid-template-columns:.72fr 1.28fr;gap:70px;flex:1;align-items:center}.timelineIntro{font-size:18px;line-height:1.5;color:var(--muted);max-width:430px}.timeline{border-top:1px solid var(--ink)}.event{display:grid;grid-template-columns:90px 95px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.event .date,.event .type{font-size:11px;font-weight:700;letter-spacing:.1em}.event .type{color:var(--accent)}.event h3{font-size:19px;margin:0 0 4px}.event p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.peopleIntro{font-size:18px;line-height:1.5;color:var(--muted);max-width:680px;margin-top:-8px}.peopleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto;padding:36px 0 4vh}.person{min-height:410px;border:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:space-between}.personCode{font-size:54px;font-weight:700;letter-spacing:-.06em}.person blockquote{font:28px/1.15 Georgia,serif;margin:22px 0}.personMeta{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:end}.personMeta strong{font-size:14px}.personMeta small{color:var(--muted)}.pill{border:1px solid var(--ink);padding:6px 8px;border-radius:99px;font-size:10px;letter-spacing:.1em}
.mapPage{background:#e5e1d7}.mapLayout{display:grid;grid-template-columns:.78fr 1.22fr;gap:48px;flex:1;align-items:center}.mapCopy p{font-size:20px;line-height:1.5;max-width:500px}.map{height:min(63vh,650px);border:1px solid var(--ink);position:relative;background:linear-gradient(90deg,transparent 49.8%,rgba(0,0,0,.08) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(0,0,0,.08) 50%,transparent 50.2%)}.map:before{content:"";position:absolute;inset:11% 8%;border:1px dashed #a9a59b;border-radius:48% 42% 51% 46%}.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer}.dot{width:17px;height:17px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px rgba(242,106,33,.16);transition:.18s}.pin:hover .dot,.pin.active .dot{transform:scale(1.3)}.tooltip{position:absolute;left:22px;top:-18px;min-width:170px;background:#111;color:#fff;padding:10px 12px;opacity:0;transform:translateY(5px);transition:.18s;pointer-events:none}.pin:hover .tooltip,.pin.active .tooltip{opacity:1;transform:none}.tooltip b{font-size:11px;letter-spacing:.1em}.tooltip span{display:block;font-size:12px;color:#aaa;margin-top:4px}
.system{background:var(--accent);color:#111}.systemLayout{display:grid;grid-template-columns:1.2fr .8fr;gap:62px;flex:1;align-items:center}.system .section{margin:0 0 28px}.system p{font-size:21px;line-height:1.48;max-width:650px}.flow{border-top:2px solid #111}.flowItem{display:grid;grid-template-columns:48px 1fr auto;align-items:center;padding:16px 0;border-bottom:1px solid #111}.flowItem .i{font-size:12px;font-weight:700}.flowItem strong{font-size:18px}.flowItem small{font-size:11px;letter-spacing:.1em;text-transform:uppercase}.footerMark{margin-top:28px;font-size:11px;font-weight:700;letter-spacing:.13em}
.nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:50}.nav button{width:8px;height:8px;border:0;border-radius:50%;background:#8887;padding:0}.nav button.active{background:var(--accent);transform:scale(1.45)}.progress{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0;z-index:60}.hint{position:fixed;left:12px;bottom:10px;background:#111;color:#fff;padding:6px 9px;font-size:9px;letter-spacing:.1em;z-index:50;opacity:.7}
@media(max-width:820px){.inner{padding:28px 0 34px}.coverGrid,.leadBody,.timelineLayout,.mapLayout,.systemLayout{grid-template-columns:1fr}.coverGrid{gap:24px;align-items:center}.coverSide{align-self:start}.coverSide p{font-size:22px}.leadBody{gap:30px}.stats{margin-bottom:18px}.timelineLayout{gap:24px;padding:5vh 0}.event{grid-template-columns:72px 80px 1fr}.peopleGrid{grid-template-columns:1fr;overflow:auto}.person{min-height:280px}.map{height:48vh}.systemLayout{padding:6vh 0}.nav{right:7px}.hint{display:none}}
</style>
</head>
<body>
<div class="progress"></div><div class="nav"></div><div class="hint">SCROLL / ↑ ↓</div>
<main class="mag">
<section class="page cover" id="p1"><div class="inner"><div class="top"><span data-meta="title"></span><span data-meta="issue"></span></div><div class="coverGrid"><div><div class="eyebrow" data-cover="eyebrow"></div><h1 data-cover="title"></h1></div><div class="coverSide"><p data-cover="subtitle"></p><div class="tags" id="coverTags"></div></div></div></div></section>
<section class="page" id="p2"><div class="inner"><div class="top"><span data-lead="section"></span><span class="num">02 / 06</span></div><h2 class="section" data-lead="title"></h2><div class="leadBody"><div><p data-lead="body"></p><div class="note" data-lead="note"></div></div><div class="stats" id="stats"></div></div></div></section>
<section class="page" id="p3"><div class="inner"><div class="top"><span data-timeline="section"></span><span class="num">03 / 06</span></div><div class="timelineLayout"><div><h2 class="section" data-timeline="title"></h2><p class="timelineIntro" data-timeline="intro"></p></div><div class="timeline" id="timeline"></div></div></div></section>
<section class="page" id="p4"><div class="inner"><div class="top"><span data-people="section"></span><span class="num">04 / 06</span></div><h2 class="section" data-people="title"></h2><p class="peopleIntro" data-people="intro"></p><div class="peopleGrid" id="people"></div></div></section>
<section class="page mapPage" id="p5"><div class="inner"><div class="top"><span data-map="section"></span><span class="num">05 / 06</span></div><div class="mapLayout"><div class="mapCopy"><h2 class="section" data-map="title"></h2><p data-map="body"></p></div><div class="map" id="map"></div></div></div></section>
<section class="page system" id="p6"><div class="inner"><div class="top"><span data-closing="section"></span><span class="num">06 / 06</span></div><div class="systemLayout"><div><h2 class="section" data-closing="title"></h2><p data-closing="body"></p><div class="footerMark" data-closing="footer"></div></div><div class="flow" id="flow"></div></div></div></section>
</main>
<script>
(async()=>{const d=await fetch('./content.json',{cache:'no-store'}).then(r=>r.json());document.documentElement.style.setProperty('--accent',d.meta.accent);const bind=(group,obj)=>Object.entries(obj).forEach(([k,v])=>{if(typeof v==='string')document.querySelectorAll(`[data-${group}="${k}"]`).forEach(el=>el.textContent=v)});bind('meta',d.meta);bind('cover',d.cover);bind('lead',d.lead);bind('timeline',d.timeline);bind('people',d.people);bind('map',d.map);bind('closing',d.closing);coverTags.innerHTML=d.cover.tags.map(x=>`<span class="tag">${x}</span>`).join('');stats.innerHTML=d.lead.stats.map(x=>`<div class="stat"><div class="value">${x.value}</div><div class="label">${x.label}</div></div>`).join('');timeline.innerHTML=d.timeline.items.map(x=>`<div class="event"><div class="date">${x.date}</div><div class="type">${x.type}</div><div><h3>${x.title}</h3><p>${x.desc}</p></div></div>`).join('');people.innerHTML=d.people.profiles.map(x=>`<article class="person"><div class="personCode">${x.code}</div><blockquote>“${x.quote}”</blockquote><div class="personMeta"><div><strong>${x.role}</strong><br><small>${x.place}</small></div><span class="pill">${x.tag}</span></div></article>`).join('');map.innerHTML=d.map.locations.map((x,i)=>`<div class="pin" style="left:${x.x}%;top:${x.y}%" tabindex="0"><div class="dot"></div><div class="tooltip"><b>${x.label} · ${x.count} STORIES</b><span>${x.theme}</span></div></div>`).join('');document.querySelectorAll('.pin').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.pin').forEach(q=>q.classList.remove('active'));p.classList.add('active')}));flow.innerHTML=d.closing.flow.map((x,i)=>`<div class="flowItem"><span class="i">0${i+1}</span><strong>${x.name}</strong><small>${x.desc}</small></div>`).join('')})().catch(e=>{document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;background:#111;color:white;display:grid;place-items:center;padding:30px;z-index:99">内容加载失败，请刷新页面。</div>')});
const pages=[...document.querySelectorAll('.page')],nav=document.querySelector('.nav'),prog=document.querySelector('.progress');pages.forEach((p,i)=>{const b=document.createElement('button');b.title=`Page ${i+1}`;b.onclick=()=>p.scrollIntoView({behavior:'smooth'});nav.appendChild(b)});const dots=[...nav.children];new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=pages.indexOf(e.target);dots.forEach((d,j)=>d.classList.toggle('active',i===j))}}),{threshold:.58}).observe(pages[0]);const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=pages.indexOf(e.target);dots.forEach((d,j)=>d.classList.toggle('active',i===j))}}),{threshold:.58});pages.forEach(p=>io.observe(p));addEventListener('scroll',()=>{const m=document.documentElement.scrollHeight-innerHeight;prog.style.width=(m?scrollY/m*100:0)+'%'},{passive:true});addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key))return;e.preventDefault();const y=scrollY+innerHeight*.5;let i=pages.findIndex(p=>p.offsetTop<=y&&p.offsetTop+p.offsetHeight>y);if(i<0)i=0;i+=(e.key==='ArrowDown'||e.key==='PageDown')?1:-1;i=Math.max(0,Math.min(i,pages.length-1));pages[i].scrollIntoView({behavior:'smooth'})});
</script>
</body>
</html>
